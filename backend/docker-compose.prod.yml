services:
  # --- Infrastructure ---
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    volumes:
      - typesensedata:/data
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend (production: built image) ---
  # One process serves the whole API (gateway + every module); see
  # apps/api/src/index.ts. The image is still pushed to the
  # materialhub-api-gateway ECR repository (terraform/shared/ecr.tf), so no new
  # repository is needed.
  #
  # Environment: the union of what the former api-gateway, auth, product,
  # order, vendor, notification, cms and integration services received. Not
  # carried over: PORT (each service got its own; nothing reads it, the API
  # listens on GATEWAY_PORT) and the module addressing vars
  # (AUTH_HOST/..._HOST, INTEGRATION_PORT), since modules are now called
  # in-process and their defaults only need to be distinct.
  api:
    image: ${ECR_REGISTRY}/materialhub-api-gateway:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - GATEWAY_PORT=3000
      # Auth + internal
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - TWO_FA_ENCRYPTION_KEY=${TWO_FA_ENCRYPTION_KEY}
      # Phone OTP (SMS_OTP_PROVIDER=twilio or whatsapp)
      - SMS_OTP_PROVIDER=${SMS_OTP_PROVIDER}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
      # WhatsApp Cloud API: OTP (auth) and messages + webhook (notification).
      # Without these the notification module falls back to
      # StubWhatsAppDispatcher (messages "sent" to stdout only) and the webhook
      # 403s every request, so Meta's subscription handshake never completes.
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_API_BASE_URL=${WHATSAPP_API_BASE_URL}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_TEMPLATE_LANGUAGE=${WHATSAPP_TEMPLATE_LANGUAGE}
      - WHATSAPP_OTP_TEMPLATE_NAME=${WHATSAPP_OTP_TEMPLATE_NAME}
      # Search + catalogue caches
      - TYPESENSE_HOST=${TYPESENSE_HOST}
      - TYPESENSE_PORT=${TYPESENSE_PORT}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
      - TYPESENSE_COLLECTION=${TYPESENSE_COLLECTION}
      - CATEGORY_TREE_CACHE_TTL=${CATEGORY_TREE_CACHE_TTL}
      - PRODUCT_DETAIL_CACHE_TTL=${PRODUCT_DETAIL_CACHE_TTL}
      - PRODUCT_LIST_CACHE_TTL=${PRODUCT_LIST_CACHE_TTL}
      # Payments. VENDOR_ENCRYPTION_KEY (AES-256-GCM) encrypts
      # vendor_bank_accounts rows (vendor module) and decrypts them for the
      # audited bank-detail reveal (admin-payout.controller.ts revealBank).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - VENDOR_ENCRYPTION_KEY=${VENDOR_ENCRYPTION_KEY}
      # AWS: SES email, S3 media, CloudFront
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_MEDIA_BUCKET=${S3_MEDIA_BUCKET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      # Sales-channel feeds + integration credentials
      - INTEGRATION_FEED_BUCKET=${INTEGRATION_FEED_BUCKET}
      - INTEGRATION_FEED_BASE_URL=${INTEGRATION_FEED_BASE_URL}
      - WEB_BASE_URL=${WEB_BASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      default:
        # The Caddyfile mounted below is not in this repo and may still proxy
        # to the former gateway's hostname.
        aliases:
          - api-gateway
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.GATEWAY_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    privileged: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL=${GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL}
      - GRAFANA_CLOUD_USERNAME=${GRAFANA_CLOUD_USERNAME}
      - GRAFANA_CLOUD_METRICS_USERNAME=${GRAFANA_CLOUD_METRICS_USERNAME}
      - GRAFANA_CLOUD_LOGS_USERNAME=${GRAFANA_CLOUD_LOGS_USERNAME}
      - GRAFANA_CLOUD_TOKEN=${GRAFANA_CLOUD_TOKEN}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
      # cAdvisor (per-container metrics) needs host fs access; cgroup v2 on AL2023
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run:/var/run:ro
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped

  # --- Tools ---
  migrate:
    image: ${ECR_REGISTRY}/materialhub-api-gateway:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USERNAME}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # The image has no root `migrate` script; run the entrypoint by path.
    command: ["bun", "run", "libs/database/src/run-migrations.ts"]

volumes:
  pgdata:
  redisdata:
  typesensedata:
  caddy_data:
  caddy_config:
  alloydata:
