# MaterialHub backend — Netcup staging
#
# Differences from docker-compose.prod.yml:
#   - Images: ghcr.io/${GHCR_OWNER}/materialhub-* (was ${ECR_REGISTRY}/...)
#   - No embedded Caddy: host Caddy on the Netcup box owns 80/443 and reverse-proxies localhost:3000
#   - Only api publishes to host (bound to 127.0.0.1 — Caddy reaches via loopback)
#   - Postgres bound to 127.0.0.1:5432 — accessible from host shell for psql/pg_dump, not from internet
#   - Redis and Typesense internal-only via the default compose network
#   - api and migrate use env_file: .env (the prod.yml lists each var explicitly,
#     which dropped DB_PASSWORD and friends here — see deploy log run 26602000736).
#   - Typesense healthcheck disabled because the image has no curl/wget; api
#     waits on service_started instead. Typesense's own readiness handles app-side retries.
#
# The backend is ONE process (backend/apps/api: gateway + every module). The
# image keeps the materialhub-api-gateway package name so the box's existing
# GHCR pull access keeps working.
#
# Renders via .env that the deploy workflow SCPs to /opt/materialhub/.env.

services:
  postgres:
    # imresamu/postgis publishes multi-arch (linux/amd64 + linux/arm64) PostGIS images;
    # the upstream postgis/postgis tags are amd64-only and fail healthcheck on this VPS.
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    volumes:
      - typesensedata:/data
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors"
    # Image has no curl/wget; using disable: true so compose treats it as no
    # healthcheck. Dependents use condition: service_started.
    healthcheck:
      disable: true
    restart: unless-stopped

  # The whole API (gateway + every module) in one process. Its environment is
  # the union of what the former api-gateway and the seven module services
  # received (all of them used env_file: .env); PORT, which each got with its
  # own value and nothing reads, is dropped: the API listens on GATEWAY_PORT.
  api:
    image: ghcr.io/${GHCR_OWNER}/materialhub-api-gateway:${IMAGE_TAG:-staging}
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      # VENDOR_ENCRYPTION_KEY (AES-256-GCM) encrypts vendor_bank_accounts rows
      # (vendor module) and decrypts them for the audited bank-detail reveal
      # (admin-payout.controller.ts revealBank). Also in .env; listed so a
      # missing key is obvious here.
      - VENDOR_ENCRYPTION_KEY=${VENDOR_ENCRYPTION_KEY}
      - INTEGRATION_FEED_BUCKET=${INTEGRATION_FEED_BUCKET}
      - INTEGRATION_FEED_BASE_URL=${INTEGRATION_FEED_BASE_URL}
      - WEB_BASE_URL=${WEB_BASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.GATEWAY_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    restart: unless-stopped

  migrate:
    image: ghcr.io/${GHCR_OWNER}/materialhub-api-gateway:${IMAGE_TAG:-staging}
    profiles: ["tools"]
    # @materialhub/config eagerly requireEnv's JWT_ACCESS_SECRET (and friends)
    # at import time when NODE_ENV=production. data-source.ts pulls config
    # in transitively, so the migration runner needs the same env surface
    # the api has. env_file is simpler than re-listing every secret.
    env_file: .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USERNAME}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # The image's root package.json (/app) has no `migrate` script, so
    # `bun run migrate` from /app fails with "Script not found". Invoke the
    # migration entrypoint by file path instead — matches the pattern the
    # api Dockerfile uses (`bun run apps/api/src/index.ts`).
    command: ["bun", "run", "libs/database/src/run-migrations.ts"]

volumes:
  pgdata:
  redisdata:
  typesensedata:
