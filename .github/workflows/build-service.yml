name: Build API Image

# Builds and pushes the backend image. The backend is one process
# (backend/apps/api: the gateway plus every module), so there is one image.
#
# It is pushed to the existing materialhub-api-gateway ECR repository: the
# repositories are managed in terraform/shared/ecr.tf (var.services), and
# reusing this one means the monolith needs no `terraform apply`. The former
# per-service repositories (materialhub-auth-service, ...) are left in place
# and no longer receive pushes.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "staging or production"
      image-tag:
        required: true
        type: string

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: materialhub-api-gateway

jobs:
  build-and-push:
    name: Build api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build \
            -f backend/apps/api/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ inputs.image-tag }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ inputs.environment }} \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
