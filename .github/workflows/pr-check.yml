name: PR Check

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with "packageManager" in the root package.json.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx --bun @biomejs/biome@1.9.4 check --diagnostic-level=error .
        working-directory: backend

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify no legacy vendor-role references
        run: ./scripts/check-no-legacy-vendor-role.sh

      - name: Typecheck
        run: >-
          bunx turbo run typecheck
          --filter='@materialhub/api'
          --filter='@materialhub/auth-service'
          --filter='@materialhub/product-service'
          --filter='@materialhub/order-service'
          --filter='@materialhub/vendor-service'
          --filter='@materialhub/notification-service'
          --filter='@materialhub/cms-service'
          --filter='@materialhub/integration-service'

      # Unit tests only. Integration tests (*.integration.test.ts,
      # tests/integration/**) need live Postgres/Redis not present in CI and are
      # run separately — see backend/scripts/test-ci.sh.
      - name: Test
        run: bash backend/scripts/test-ci.sh

      # The backend is one process: only @materialhub/api has a build (it
      # bundles every module). The modules are typechecked and tested above.
      - name: Build
        run: bunx turbo run build --filter='@materialhub/api'
