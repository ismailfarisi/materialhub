name: Deploy to Staging (AWS — legacy)

# Superseded by deploy-staging-netcup.yml as the default staging deploy.
# Kept manual-only (workflow_dispatch) as a fallback during/after cutover.

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ----- Detect what changed -----
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      any-backend: ${{ steps.filter.outputs.any-backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # One backend image (backend/apps/api), so any backend change
          # rebuilds it.
          filters: |
            any-backend:
              - 'backend/**'

  # ----- Backend: lint & test -----
  backend-checks:
    name: Backend Lint & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.any-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx --bun @biomejs/biome@1.9.4 check --diagnostic-level=error .
        working-directory: backend
      - name: Test
        run: >-
          bunx turbo run test
          --filter='@materialhub/api'
          --filter='@materialhub/auth-service'
          --filter='@materialhub/product-service'
          --filter='@materialhub/order-service'
          --filter='@materialhub/vendor-service'
          --filter='@materialhub/notification-service'
          --filter='@materialhub/cms-service'
          --filter='@materialhub/integration-service'

  # ----- Sync GitHub Secrets to AWS SSM -----
  sync-secrets-to-ssm:
    name: Sync Secrets → SSM
    needs: [detect-changes]
    if: needs.detect-changes.outputs.any-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push secrets to SSM
        env:
          JWT_ACCESS_SECRET: ${{ secrets.STAGING_JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.STAGING_INTERNAL_SERVICE_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_CONNECT_WEBHOOK_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          VENDOR_ENCRYPTION_KEY: ${{ secrets.STAGING_VENDOR_ENCRYPTION_KEY }}
          ENCRYPTION_KEY: ${{ secrets.STAGING_ENCRYPTION_KEY }}
          TWO_FA_ENCRYPTION_KEY: ${{ secrets.STAGING_TWO_FA_ENCRYPTION_KEY }}
          CLOUDFLARE_STREAM_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_STREAM_ACCOUNT_ID }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_STREAM_API_TOKEN }}
          CLOUDFLARE_STREAM_WEBHOOK_SECRET: ${{ secrets.STAGING_CLOUDFLARE_STREAM_WEBHOOK_SECRET }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.STAGING_GOOGLE_GEMINI_API_KEY }}
          TYPESENSE_API_KEY: ${{ secrets.STAGING_TYPESENSE_API_KEY }}
          TAMARA_API_TOKEN: ${{ secrets.STAGING_TAMARA_API_TOKEN }}
          TAMARA_API_BASE_URL: ${{ secrets.STAGING_TAMARA_API_BASE_URL }}
          TAMARA_NOTIFICATION_TOKEN: ${{ secrets.STAGING_TAMARA_NOTIFICATION_TOKEN }}
          TAMARA_SUCCESS_URL: ${{ secrets.STAGING_TAMARA_SUCCESS_URL }}
          TAMARA_FAILURE_URL: ${{ secrets.STAGING_TAMARA_FAILURE_URL }}
          TAMARA_CANCEL_URL: ${{ secrets.STAGING_TAMARA_CANCEL_URL }}
          TAMARA_NOTIFICATION_URL: ${{ secrets.STAGING_TAMARA_NOTIFICATION_URL }}
          POSTAPLUS_PARTNER_KEY: ${{ secrets.STAGING_POSTAPLUS_PARTNER_KEY }}
          POSTAPLUS_TENANT: ${{ secrets.STAGING_POSTAPLUS_TENANT }}
          POSTAPLUS_CUSTOMER: ${{ secrets.STAGING_POSTAPLUS_CUSTOMER }}
          POSTAPLUS_CREATED_BY: ${{ secrets.STAGING_POSTAPLUS_CREATED_BY }}
          POSTAPLUS_BASE_URL: ${{ secrets.STAGING_POSTAPLUS_BASE_URL }}
          POSTAPLUS_SHIPMENT_TYPE: ${{ secrets.STAGING_POSTAPLUS_SHIPMENT_TYPE }}
          POSTAPLUS_PACKAGE_TYPE: ${{ secrets.STAGING_POSTAPLUS_PACKAGE_TYPE }}
          POSTAPLUS_SERVICE: ${{ secrets.STAGING_POSTAPLUS_SERVICE }}
          POSTAPLUS_VEHICLE: ${{ secrets.STAGING_POSTAPLUS_VEHICLE }}
          POSTAPLUS_PICKUP_TYPE: ${{ secrets.STAGING_POSTAPLUS_PICKUP_TYPE }}
          SMS_OTP_PROVIDER: ${{ secrets.STAGING_SMS_OTP_PROVIDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.STAGING_TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.STAGING_TWILIO_VERIFY_SERVICE_SID }}
        run: |
          set -euo pipefail
          PREFIX="/materialhub/staging"
          # Pairs: ssm_path_tail|env_var_name
          PAIRS=(
            "jwt/access-secret|JWT_ACCESS_SECRET"
            "jwt/refresh-secret|JWT_REFRESH_SECRET"
            "internal-service-secret|INTERNAL_SERVICE_SECRET"
            "stripe/secret-key|STRIPE_SECRET_KEY"
            "stripe/connect-webhook|STRIPE_CONNECT_WEBHOOK_SECRET"
            "stripe/payment-webhook|STRIPE_WEBHOOK_SECRET"
            "encryption/vendor-key|VENDOR_ENCRYPTION_KEY"
            "encryption/key|ENCRYPTION_KEY"
            "encryption/two-fa-key|TWO_FA_ENCRYPTION_KEY"
            "cloudflare/account-id|CLOUDFLARE_STREAM_ACCOUNT_ID"
            "cloudflare/api-token|CLOUDFLARE_STREAM_API_TOKEN"
            "cloudflare/webhook-secret|CLOUDFLARE_STREAM_WEBHOOK_SECRET"
            "db/password|DB_PASSWORD"
            "google/drive-api-key|GOOGLE_DRIVE_API_KEY"
            "google/gemini-api-key|GOOGLE_GEMINI_API_KEY"
            "typesense/api-key|TYPESENSE_API_KEY"
            "tamara/api-token|TAMARA_API_TOKEN"
            "tamara/api-base-url|TAMARA_API_BASE_URL"
            "tamara/notification-token|TAMARA_NOTIFICATION_TOKEN"
            "tamara/success-url|TAMARA_SUCCESS_URL"
            "tamara/failure-url|TAMARA_FAILURE_URL"
            "tamara/cancel-url|TAMARA_CANCEL_URL"
            "tamara/notification-url|TAMARA_NOTIFICATION_URL"
            "postaplus/partner-key|POSTAPLUS_PARTNER_KEY"
            "postaplus/tenant|POSTAPLUS_TENANT"
            "postaplus/customer|POSTAPLUS_CUSTOMER"
            "postaplus/created-by|POSTAPLUS_CREATED_BY"
            "postaplus/base-url|POSTAPLUS_BASE_URL"
            "postaplus/shipment-type|POSTAPLUS_SHIPMENT_TYPE"
            "postaplus/package-type|POSTAPLUS_PACKAGE_TYPE"
            "postaplus/service|POSTAPLUS_SERVICE"
            "postaplus/vehicle|POSTAPLUS_VEHICLE"
            "postaplus/pickup-type|POSTAPLUS_PICKUP_TYPE"
            "sms/otp-provider|SMS_OTP_PROVIDER"
            "twilio/account-sid|TWILIO_ACCOUNT_SID"
            "twilio/auth-token|TWILIO_AUTH_TOKEN"
            "twilio/verify-service-sid|TWILIO_VERIFY_SERVICE_SID"
          )
          missing=()
          for pair in "${PAIRS[@]}"; do
            path_tail="${pair%%|*}"
            var_name="${pair##*|}"
            value="${!var_name:-}"
            if [[ -z "$value" ]]; then
              missing+=("$var_name")
              continue
            fi
            aws ssm put-parameter \
              --name "${PREFIX}/${path_tail}" \
              --value "$value" \
              --type SecureString \
              --overwrite \
              --no-cli-pager >/dev/null
            echo "  ✓ ${PREFIX}/${path_tail}"
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::warning::Missing GitHub Secrets (skipped): ${missing[*]}"
          fi
          echo "✅ Synced $((${#PAIRS[@]} - ${#missing[@]})) of ${#PAIRS[@]} secrets"

  # ----- Build & push the API image -----
  # One image: the backend runs as one process (backend/apps/api). It goes to
  # the existing materialhub-api-gateway ECR repo; see build-service.yml.
  build-api:
    needs: [backend-checks, detect-changes]
    uses: ./.github/workflows/build-service.yml
    with:
      environment: staging
      image-tag: ${{ github.sha }}
    secrets: inherit

  # ----- Deploy to EC2 -----
  deploy-backend:
    name: Deploy Backend to EC2
    needs:
      - detect-changes
      - sync-secrets-to-ssm
      - build-api
    if: |
      always() &&
      needs.detect-changes.outputs.any-backend == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # SCP into /tmp (writable by ec2-user) — /opt/materialhub is root-owned and
      # holds a root-owned copy from user-data, so direct overwrite as ec2-user
      # fails with "Permission denied". The SSH step below moves it into place.
      - name: Upload deploy artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # drone-scp v1.6.14 (used by scp-action@v0.1.7) parses INPUT_SOURCE
          # as a comma-separated list, NOT newline-separated. A `|` block
          # scalar produces a single string with embedded newlines that
          # drone-scp treats as one path and fails to find — see the
          # "tar: empty archive" error from run 25066011756.
          source: "scripts/refresh-env-from-ssm.sh"
          target: /tmp/
          strip_components: 1
          overwrite: true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com"

            # Move the SCP'd script into /opt/materialhub over any root-owned copy.
            sudo install -m 755 -o root -g root \
              /tmp/refresh-env-from-ssm.sh \
              /opt/materialhub/refresh-env-from-ssm.sh
            rm -f /tmp/refresh-env-from-ssm.sh

            cd /opt/materialhub

            # The backend is now ONE process, served by the api-gateway
            # service (same image repo). This box's docker-compose.yml was
            # written by the retired terraform/staging user-data and still
            # lists the seven module services; a compose override parks them
            # under an inactive profile so they no longer start, gives
            # api-gateway the whole .env and raises its memory limit (it now
            # holds every module).
            # Idempotent; the base file is left untouched.
            {
              echo "# Written by deploy-staging.yml: backend runs as one process (api-gateway)."
              echo "services:"
              echo "  api-gateway:"
              # env_file: the union of every module's environment (.env).
              echo "    env_file: .env"
              echo "    mem_limit: 2g"
              for svc in auth-service product-service order-service vendor-service \
                         notification-service cms-service integration-service; do
                if sudo grep -q "^  ${svc}:" docker-compose.yml; then
                  echo "  ${svc}:"
                  echo "    profiles: [\"retired\"]"
                fi
              done
            } | sudo tee docker-compose.override.yml >/dev/null
            for svc in auth-service product-service order-service vendor-service \
                       notification-service cms-service integration-service; do
              docker ps -aq --filter "label=com.docker.compose.service=${svc}" | xargs -r docker rm -f
            done

            # Refresh .env from SSM (idempotent; preserves non-SSM lines,
            # including the static entries appended above).
            sudo AWS_REGION=ap-south-1 /opt/materialhub/refresh-env-from-ssm.sh \
              /opt/materialhub/.env materialhub staging

            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
            docker-compose pull
            # Run pending migrations before cycling services, using the one-shot
            # `migrate` profile in docker-compose.yml. Profiles: ["tools"] means
            # it doesn't start automatically with `up`.
            docker-compose --profile tools run --rm migrate
            # --force-recreate ensures containers pick up new .env values
            # even when image tags haven't changed (e.g., secret rotation only).
            docker-compose up -d --remove-orphans --force-recreate
            # Restart Caddy so it re-resolves the api-gateway DNS entry.
            # When the container is recreated it gets a new IP, but
            # Caddy caches the old IP and returns 502 until restarted.
            docker-compose restart caddy
            docker image prune -f
